<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1895 952" role="img" aria-label="Карта ориентиров вокруг библиотеки «Сфера»">
<style>
.paper{fill:#F6F3EA}.water{fill:#B5D3C8}.park{fill:#E6EBCB}
.cc{fill:none;stroke:#fff;stroke-width:16;stroke-linecap:round;stroke-linejoin:round}
.cr{fill:none;stroke:#E2DCCB;stroke-width:9;stroke-linecap:round;stroke-linejoin:round}
.hc{fill:none;stroke:#fff;stroke-width:22;stroke-linecap:round;stroke-linejoin:round}
.hr{fill:none;stroke:#2B2B2B;stroke-width:11;stroke-linecap:round;stroke-linejoin:round;transition:stroke .25s}
.hr.on{stroke:#5E8A76}
.lb{font:italic 26px Montserrat,Arial,sans-serif;fill:#8A978F;letter-spacing:1px}
.nm{font:500 30px Montserrat,'Segoe UI',Arial,sans-serif;fill:#1E1E1E;paint-order:stroke;stroke:#F6F3EA;stroke-width:8px;stroke-linejoin:round}
.pt{cursor:pointer}.pt .b{fill:#E8D95B;stroke:#2B2B2B;stroke-width:3;transition:all .25s;transform-box:fill-box;transform-origin:center}
.pt text.n{font:600 26px Montserrat,Arial,sans-serif;fill:#1E1E1E;text-anchor:middle;transition:fill .25s}
.pt:hover .b,.pt.on .b{fill:#5E8A76;stroke:#fff;transform:scale(1.25)}
.pt:hover text.n,.pt.on text.n{fill:#fff}
.pulse{fill:#5E8A76;opacity:.18;transform-box:fill-box;transform-origin:center;animation:p 2.4s ease-out infinite}
@keyframes p{0%{transform:scale(.6);opacity:.35}100%{transform:scale(2.2);opacity:0}}
</style>
